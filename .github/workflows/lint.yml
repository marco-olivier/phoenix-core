name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install linters
      run: |
        pip install black mypy ruff
    
    - name: Run black
      run: black --check src/
    
    - name: Run ruff
      run: ruff check src/
    
    - name: Run mypy
      run: mypy src/ --ignore-missing-imports
